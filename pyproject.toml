[project]
name = "encoder-decoder-transformer"
version = "0.1.0"
description = "A from-scratch PyTorch implementation of the Transformer encoder-decoder architecture."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Joe Rice", email = "2Joerice@gmail.com" }
]
requires-python = ">=3.13"
keywords = ["transformer", "pytorch", "attention", "encoder-decoder", "deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "D", "T20", "TC", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src"]
